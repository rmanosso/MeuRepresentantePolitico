titulo: Fim da escala 6x1 e jornada de 40 horas
tema: Trabalho e emprego
atualizado_em: '2026-10-07'
relacionadas: [pec-12-2026]
resumo: Reduz a jornada máxima de 44 para 40 horas semanais, com limite de 8 horas por dia e dois dias de descanso
  remunerado por semana, um preferencialmente no domingo, sem redução de salário. Na transição, a jornada cai para 42
  horas dois meses após a publicação e para 40 horas 12 meses depois disso. Acordos coletivos podem compensar horários
  e, em serviços essenciais, acumular folgas no mês.
# Três frases curtas para os cards do Instagram (mesmas fontes do resumo).
pontos:
- Jornada máxima cai de 44 para 40 horas semanais
- Dois dias de descanso por semana, sem redução de salário
- 'Transição: 42 horas após 2 meses e 40 horas 12 meses depois'
