  resumo: Criar o Hub da Prosperidade, programa de qualificação com porta única que acompanha a pessoa do primeiro
    curso até o emprego ou a abertura do próprio negócio.
  fontes:
  - titulo: Plano de governo registrado no TSE (p. 60)
