    a mulher, que ficam impedidos de ocupar cargos estaduais e de receber crédito e moradia do Estado.
  fontes:
  - titulo: Plano de governo registrado no TSE (p. 37)
    url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_SP.zip
- tema: Assistência social
  resumo: Criar o programa Cuidar Para Todos, da primeira infância à pessoa idosa, com centros-dia, cuidados domiciliares
    e apoio financeiro a cuidadores familiares de idosos em alta dependência.
  fontes:
  - titulo: Plano de governo registrado no TSE (p. 29 e 30)
