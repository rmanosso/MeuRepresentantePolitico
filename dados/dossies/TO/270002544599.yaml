  titulo: Ações penais sobre compra de material didático sem licitação (2003–2004)
  data: '2019-06-04'
  resumo: Denunciada pelo MPF por compras diretas de material didático quando era secretária de Educação. Na AP
    946, foi condenada pela 1ª Turma do STF em 2017, mas o Plenário a absolveu em embargos infringentes em agosto
    de 2018 (8 a 3). Na AP 962, a 1ª Turma a absolveu em junho de 2019 (4 a 1), por falta de prova de dolo e de
    sobrepreço.
  processo: AP 946 e AP 962 (STF)
