  titulo: Ação penal no STF por calúnia contra o ministro Gilmar Mendes
  data: '2024-06-04'
  resumo: Em vídeo que circulou em 2023, Moro aparece falando em "comprar um habeas corpus" de Gilmar Mendes. A PGR
    o denunciou por calúnia e, em junho de 2024, a Primeira Turma do STF recebeu a denúncia por unanimidade. Em 2025
    a Turma formou maioria para rejeitar o recurso da defesa. Ainda não há julgamento sobre condenação ou absolvição.
  resposta: Moro afirma que nunca acusou o ministro de vender decisões e que o vídeo foi gravado e editado sem seu
    conhecimento.
