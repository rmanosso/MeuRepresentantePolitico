conduta:
  - tipo: criminal
    situacao: arquivado
    titulo: Caso das "rachadinhas" no gabinete da Alerj
    status: confirmado
    nota_revisao: >-
      Caso criminal encerrado (arquivamento em 2022), confirmado por quatro veículos. Conferir se
      continua correto que Flávio não é réu na ação de improbidade de 2023 e se há documento
      oficial do TJ-RJ que possa substituir as fontes jornalísticas.
    data: 2022-05-16
    resumo: >-
      Em 2020 o MP-RJ denunciou Flávio, o ex-assessor Fabrício Queiroz e outras 15 pessoas por
      peculato, lavagem de dinheiro, apropriação indébita e organização criminosa, por suposto
      repasse de salários de assessores entre 2007 e 2018. Em 2021 o STJ anulou as decisões do
      juiz de 1ª instância, entendendo que o caso cabia ao Órgão Especial do TJ-RJ, o que
      invalidou provas como as quebras de sigilo. Em maio de 2022, a pedido do MP-RJ, o Órgão
      Especial arquivou a denúncia sem julgar o mérito, registrando que a investigação poderia ser
      refeita. Desde 2023 corre uma ação cível de improbidade contra oito ex-assessores, na qual
      Flávio não é réu.
    resposta: Nega a prática de "rachadinha".
    fontes:
      - titulo: TJ-RJ arquiva denúncia contra Flávio Bolsonaro por "rachadinha"
        veiculo: Consultor Jurídico
        url: https://conjur.com.br/2022-mai-16/tj-rj-arquiva-denuncia-flavio-bolsonaro-rachadinha/
      - titulo: STJ anula decisões contra Flávio Bolsonaro no caso das "rachadinhas"
        veiculo: CNN Brasil
        url: https://www.cnnbrasil.com.br/politica/stj-anula-decisoes-contra-flavio-bolsonaro-no-caso-das-rachadinhas/
      - titulo: STJ atende Flávio Bolsonaro e anula decisões do caso das "rachadinhas"
        veiculo: Poder360
        url: https://www.poder360.com.br/justica/stj-atende-flavio-bolsonaro-e-anula-decisoes-do-caso-das-rachadinhas/
      - titulo: Gilmar Mendes mantém quebra de sigilos de investigada por "rachadinha"
        veiculo: Brasil de Fato
        url: https://www.brasildefato.com.br/2026/09/29/gilmar-mendes-mantem-quebra-de-sigilos-de-investigada-por-rachadinha-em-gabinete-de-flavio-bolsonaro/
        data: 2026-09-29

