# Flavio Bolsonaro (Flavio Nantes Bolsonaro) — PRESIDENTE / BR — PL nº 22
# Plano de governo: dados abertos do TSE, arquivo BR/2026BR280002551544_01.pdf
id: "280002551544"
atualizado_em: 2026-10-05
resumo: >-
  Advogado e empresário, filho do ex-presidente Jair Bolsonaro. Foi deputado estadual no
  Rio de Janeiro por quatro mandatos (2003–2019) e é senador pelo RJ desde 2019.

propostas:
  - tema: Trabalho e emprego
    resumo: >-
      Criar contrato de primeiro emprego para jovens de 18 a 24 anos com menor custo na folha
      e contrato mais atrativo para pessoas com 50 anos ou mais desempregadas há 12 meses;
      defender o negociado sobre o legislado.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 43 e 44)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Segurança pública
    resumo: >-
      Declarar PCC, CV, milícias e demais facções como organizações narcoterroristas e criar
      um Sistema Nacional de Fronteira com tropas das Forças Armadas.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 13 e 14)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Segurança pública
    resumo: >-
      Apoiar a redução da maioridade penal de 18 para 16 anos (e punição a maiores de 14 por
      crimes graves), acabar com a progressão de regime para crimes hediondos e aprovar a
      castração química para estupradores condenados.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 13 a 15)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Segurança pública
    resumo: >-
      Construir 5 presídios federais de segurança máxima "no modelo adotado por El Salvador",
      criar meio milhão de vagas prisionais em 4 anos, implantar reconhecimento facial nacional
      com 1 milhão de câmeras e dobrar o investimento federal em segurança.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 14 e 15)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Economia e impostos
    resumo: >-
      Revisar a reforma tributária para reduzir o IVA e a carga sobre consumo e produção;
      criar nova regra fiscal focada em superávits e na queda da dívida pública; meta de
      crescimento de 4% ao ano.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 30, 49 e 71)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Assistência social
    resumo: >-
      Manter os programas sociais existentes, dar aos beneficiários prioridade em programas de
      emprego e qualificação e garantir retorno sem fila ao benefício após o seguro-desemprego;
      proibir o uso de recursos de programas sociais em apostas.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 33, 42 e 43)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Saúde
    resumo: >-
      Implantar prontuário eletrônico único vinculado ao CPF, corrigir a tabela SUS e contratar
      exames da rede privada em horários ociosos.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 25, 26 e 37)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Educação
    resumo: >-
      Priorizar a alfabetização pelo método fônico, ampliar as escolas cívico-militares, criar
      voucher educacional onde faltar vaga pública e substituir o modelo de financiamento
      estudantil por empréstimo contingente à renda.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 35 a 37)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Mulheres
    resumo: >-
      Programa "Brasil por Elas": Centrais da Mulher com serviços integrados, monitoramento por
      tornozeleira de agressores sob medida protetiva e voucher-creche onde faltar vaga pública.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 14 e 17 a 21)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Moradia
    resumo: Retomar o programa Casa Verde e Amarela com meta de 2,5 milhões de residências.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 47)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Meio ambiente
    resumo: >-
      Zerar o desmatamento ilegal até 2029; adotar licenciamento ambiental com prazo definido,
      em que a licença é concedida se o órgão não se manifestar dentro do prazo.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 49, 50 e 58)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Energia
    resumo: >-
      Permitir a exploração de gás não convencional (fracking), reduzir gradualmente a CDE e os
      impostos sobre energia e combustíveis, mantida a tarifa social.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 31 e 52)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Instituições e democracia
    resumo: >-
      Acabar com as competências criminais originárias do STF, limitar decisões monocráticas,
      propor o fim da reeleição para presidente e extinguir estruturas estatais de combate à
      desinformação, chamadas no plano de "Ministério da Verdade".
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 65 e 66)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Gestão pública
    resumo: >-
      Cortar ao menos 10 ministérios, reduzir cargos comissionados e supersalários e retomar o
      Programa Nacional de Desestatização, avaliando caso a caso.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 69 e 70)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip
  - tema: Relações exteriores
    resumo: >-
      Diplomacia "pragmática": retomar a adesão à OCDE, recompor relações com Argentina, Estados
      Unidos e Israel e negociar com todos os mercados, incluindo China e União Europeia.
    fontes:
      - titulo: Plano de governo registrado no TSE (p. 62 e 63)
        url: https://cdn.tse.jus.br/estatistica/sead/odsele/proposta_governo/proposta_governo_2026_BR.zip

